CONFIG_ZTEST=y

# Enable PMU support
CONFIG_ARM64_PMU=y
CONFIG_ARM64_PMU_LOG_LEVEL_INF=y

# SMP: enable CPU mask API for pinning helper threads to the same core
CONFIG_SCHED_CPU_MASK=y

# Stack sizes
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096

# irq_offload() for interrupt latency test
CONFIG_IRQ_OFFLOAD=y

# Minimize timer interrupt noise during measurement
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1
CONFIG_TIMESLICING=n

# Logging and output
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
