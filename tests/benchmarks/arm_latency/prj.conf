# Pin the benchmark threads to one CPU so a yield is a real context switch.
CONFIG_SCHED_CPU_MASK=y

# Dynamic connection of the benchmark SGI handler.
CONFIG_DYNAMIC_INTERRUPTS=y

# Deterministic timing: no time-slicing, no power management.
CONFIG_TIMESLICING=n
CONFIG_PM=n

# Match FreeRTOS by default: the Xilinx FreeRTOS ports (A-profile and Cortex-R
# alike) use configUSE_TASK_FPU_SUPPORT=2, saving the full FP file on every
# switch. Enable FP sharing so a plain build reports the FreeRTOS-comparable
# number; threads touch FP (bench_touch_fp) to force Zephyr's lazy save into the
# measured window. The .int / cortex_r scenarios turn this off to show Zephyr's
# native integer-only (lazy-FP) switch, which is cheaper when FP is unused.
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

CONFIG_THREAD_NAME=y
CONFIG_MAIN_STACK_SIZE=8192

# Keep the console clean for parsing the result lines.
CONFIG_BOOT_BANNER=y
CONFIG_PRINTK=y
