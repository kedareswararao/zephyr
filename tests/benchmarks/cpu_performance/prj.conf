CONFIG_ZTEST=y

# Enable PMU support
CONFIG_ARM64_PMU=y
CONFIG_ARM64_PMU_LOG_LEVEL_INF=y

# SMP: enable CPU mask API for pinning helper threads to the same core
CONFIG_SCHED_CPU_MASK=y

# Increase main stack for large test buffers
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_ZTEST_STACK_SIZE=4096

# Enable random number generator
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_ENTROPY_GENERATOR=y

# Enable floating point for calculations
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
