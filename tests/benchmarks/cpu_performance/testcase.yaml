tests:
  benchmarks.cpu_performance:
    tags:
      - benchmark
      - cpu
      - pmu
      - arm64
    arch_allow:
      - arm64
    platform_allow:
      - qemu_cortex_a53
      - qemu_cortex_a72
      - amd_versal_net_ipp_xcvn1752_revb
    integration_platforms:
      - qemu_cortex_a53
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "Benchmark Suite Complete"
