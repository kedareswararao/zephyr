# SPDX-License-Identifier: Apache-2.0
#
# AMD ZynqMP APU — OpenOCD over XVC, CPU0 / non-SMP (default Path F).
#
# *** OpenOCD Tcl — load with openocd / west debugserver only. ***
# *** OpenOCD Tcl — D2 server only. For GDB use openocd_xvc_farm.gdb ***
#
# SMP Zephyr image: openocd_xvc_farm_smp.cfg (CPU0-only, same JTAG layout as this file)
#
# GDB on :3333: use hb (hardware breakpoints), not break — see README-zynqmp-apu-farm-xvc-e2e.md

set _ZYNQMP_APU_SUPPORT [file dirname [info script]]
source [file join $_ZYNQMP_APU_SUPPORT openocd_xvc_adapter.cfg]
source [file join $_ZYNQMP_APU_SUPPORT openocd_zynqmp_cpu0.cfg]

targets uscale.a53.0

uscale.a53.0 configure -event gdb-attach {
	echo "GDB attaching via XVC - halting CPU0 (non-SMP)"
	halt
	targets uscale.a53.0
}
