# Shared XVC adapter block for openocd_xvc_farm.cfg and openocd_xvc_farm_smp.cfg.
# OpenOCD Tcl only — never load with GDB (-x / source).

if {[info exists ::env(XVC_HOST)]} {
	set _xvc_host $::env(XVC_HOST)
} else {
	set _xvc_host localhost
}

if {[info exists ::env(XVC_PORT)]} {
	set _xvc_port $::env(XVC_PORT)
} else {
	set _xvc_port 10200
}

adapter driver xvc
xvc host $_xvc_host
xvc port $_xvc_port

# Default 100 kHz — farm XVC is slow. Lab tuning: export OPENOCD_ADAPTER_SPEED=200|500
if {[info exists ::env(OPENOCD_ADAPTER_SPEED)]} {
	adapter speed $::env(OPENOCD_ADAPTER_SPEED)
} else {
	adapter speed 100
}

transport select jtag
reset_config none

# Farm XVC: hardware breakpoints only (no software RAM patch).
gdb memory_map disable
gdb breakpoint_override hard
