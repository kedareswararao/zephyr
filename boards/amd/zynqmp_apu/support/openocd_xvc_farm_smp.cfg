# SPDX-License-Identifier: Apache-2.0
#
# AMD ZynqMP APU — OpenOCD over XVC, SMP Zephyr image (CPU0 breakpoints).
#
# *** OpenOCD Tcl — D2 server only. For GDB use openocd_xvc_farm_smp.gdb ***
#
# Farm XVC CANNOT examine CPUs 1–3 (arp_examine → JTAG-DP STICKY ERROR).
# Listing 4 A53 targets also breaks SMP bring-up (z_smp_init hangs in wfe()).
#
# Use CPU0-only OpenOCD (same as non-SMP Path F) with an SMP Zephyr image:
#   - Secondary CPUs boot via PSCI pm_cpu_on without OpenOCD JTAG management
#   - HW breakpoints on CPU0 only (same as Path A :3001)
#
# Build with threads pinned to CPU0:
#   -- -DEXTRA_CONF_FILE=boards/amd/zynqmp_apu/support/thread_debug_smp_farm.conf
#
# D2: export OPENOCD_CFG=$ZEPHYR_BASE/boards/amd/zynqmp_apu/support/openocd_xvc_farm_smp.cfg
#     (or unset OPENOCD_CFG — same CPU0 target layout as openocd_xvc_farm.cfg)
#
# 4-CPU SMP over XVC: NOT on current farm infra — see fix roadmap in .claude/
# Lab only: openocd_xvc_farm_smp_4core_experimental.cfg

set _ZYNQMP_APU_SUPPORT [file dirname [info script]]
source [file join $_ZYNQMP_APU_SUPPORT openocd_xvc_adapter.cfg]
source [file join $_ZYNQMP_APU_SUPPORT openocd_zynqmp_cpu0.cfg]

targets uscale.a53.0

uscale.a53.0 configure -event gdb-attach {
	echo "GDB attaching via XVC - halting CPU0 (SMP image, CPU0-only OpenOCD)"
	halt
	targets uscale.a53.0
}
