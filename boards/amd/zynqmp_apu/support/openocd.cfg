# SPDX-License-Identifier: Apache-2.0
#
# AMD ZynqMP APU — OpenOCD board configuration
#
# Uses the upstream OpenOCD SoC script (xilinx_zynqmp.cfg) from the Zephyr SDK.
# Intended for GDB attach after the target is booted via XSDB (PMUFW + FSBL +
# BL31 + Zephyr). OpenOCD alone cannot perform the full cold-boot chain on
# ZynqMP without PMUFW/FSBL.
#
# Probe selection (uncomment one interface block):
#   KV260 onboard JTAG  -> digilent_jtag_hs3.cfg  (default below)
#   ZCU102 + HS2        -> digilent-hs2.cfg
#   ZCU102 + HS2        -> digilent-hs2.cfg
#   Board farm (XVC)    -> openocd_xvc_farm.cfg + XVC_HOST/XVC_PORT env

source [find interface/ftdi/digilent-hs2.cfg]
adapter speed 1000

source [find target/xilinx_zynqmp.cfg]

targets uscale.a53.0

uscale.a53.0 configure -event gdb-attach {
	echo "GDB attaching — halting CPU0"
	halt
}
