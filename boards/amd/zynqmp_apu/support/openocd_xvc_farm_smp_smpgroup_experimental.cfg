# SPDX-License-Identifier: Apache-2.0
#
# EXPERIMENTAL — full OpenOCD SMP group (xilinx_zynqmp.cfg style) over farm XVC.
#
# *** DO NOT use for production.*** Causes Remote failure reply 0E / sticky JTAG
# on farm XVC when HW breakpoints replicate to deferred CPUs 1–3.
#
# Reference behavior: local USB Digilent + same SDK script.
# Lab only — after infra fixes. See fix roadmap doc.
#
# D2:
#   export OPENOCD_CFG=.../openocd_xvc_farm_smp_smpgroup_experimental.cfg
#   openocd_xvc_remote.sh server

set _ZYNQMP_APU_SUPPORT [file dirname [info script]]
source [file join $_ZYNQMP_APU_SUPPORT openocd_xvc_adapter.cfg]

# SDK upstream target script (4 targets + target smp uscale.a53.0)
source [find target/xilinx_zynqmp.cfg]

uscale.a53.0 configure -event gdb-attach {
	echo "EXPERIMENTAL SMP group: halt all cores in group"
	halt
}
