# Kconfig overlay for per-thread GDB validation on zynqmp_apu.
# Use with samples/synchronization:
#   west build -b zynqmp_apu samples/synchronization -d $BUILD_DIR \
#     -- -DEXTRA_CONF_FILE=$ZEPHYR_BASE/boards/amd/zynqmp_apu/support/thread_debug.conf

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y

# OpenOCD RTOS plugin offsets — UP builds only (depends on !SMP).
# Does not help farm hw_server GDB; required only for future local OpenOCD
# AArch64 thread-awareness work. Safe to enable on UP zynqmp_apu.
CONFIG_DEBUG_THREAD_INFO=y
