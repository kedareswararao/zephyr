# 4-CPU SMP farm XVC investigation — pins threads to CPU0 but keeps all 4 CPUs online.
#
# DO NOT use for normal farm debug — use thread_debug_smp_farm.conf (MP_MAX_NUM_CPUS=1).
#
# west build -b zynqmp_apu/zynqmp_apu/smp samples/synchronization -d $BUILD_DIR \
#   -- -DEXTRA_CONF_FILE=$ZEPHYR_BASE/boards/amd/zynqmp_apu/support/thread_debug_smp_farm_4cpu_diag.conf

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_ZYNQMP_SMP_FARM_GDB=y

# Explicit 4 CPUs (SMP board default) — for RCA / serial capture only
CONFIG_MP_MAX_NUM_CPUS=4
