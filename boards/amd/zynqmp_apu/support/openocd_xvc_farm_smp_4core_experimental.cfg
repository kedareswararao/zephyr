# SPDX-License-Identifier: Apache-2.0
#
# EXPERIMENTAL — 4× A53 targets, NO OpenOCD SMP group (farm XVC lab testing).
#
# *** DO NOT use for production farm debug.***
# Production SMP on Path F: openocd_xvc_farm_smp.cfg (CPU0-only) +
#   thread_debug_smp_farm.conf (CONFIG_MP_MAX_NUM_CPUS=1).
#
# Known failures on current farm XVC (xhdbfarmrku8, June 2026):
#   - core_up / arp_examine CPUs 1–3 → JTAG-DP STICKY ERROR
#   - continue through z_smp_init → CPU0 hang in arch_cpu_start/wfe()
#
# Use only when testing infra fixes. See:
#   .claude/README-zynqmp-apu-farm-xvc-smp-fix-roadmap.md
#
# D2:
#   export OPENOCD_CFG=$ZEPHYR_BASE/boards/amd/zynqmp_apu/support/openocd_xvc_farm_smp_4core_experimental.cfg
#   export OPENOCD_ADAPTER_SPEED=200   # optional lab tuning
#   openocd_xvc_remote.sh server

set _ZYNQMP_APU_SUPPORT [file dirname [info script]]
source [file join $_ZYNQMP_APU_SUPPORT openocd_xvc_adapter.cfg]
source [file join $_ZYNQMP_APU_SUPPORT openocd_zynqmp_a53_all_nogroup.cfg]

targets uscale.a53.0

uscale.a53.0 configure -event gdb-attach {
	echo "EXPERIMENTAL 4-core: halt CPU0; try core_up 1 2 3 (may sticky-fail on XVC)"
	halt
	targets uscale.a53.0
	if {[catch { core_up 1 2 3 } err]} {
		echo "WARN: core_up failed: $err"
		echo "WARN: farm XVC cannot examine secondary CPUs — see fix roadmap"
	}
}
