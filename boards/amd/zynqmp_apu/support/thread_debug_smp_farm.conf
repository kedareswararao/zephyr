# SMP per-thread GDB on board farm — CPU0 breakpoints only.
#
# hw_server GDB (port 3001) and OpenOCD XVC (port 3333) only debug Cortex-A53 #0.
# Do NOT disable CONFIG_SCHED_CPU_MASK — that lets threads migrate to CPUs 1–3.
#
# CONFIG_MP_MAX_NUM_CPUS=1: Path F OpenOCD cannot complete secondary CPU boot while
# the debugger is attached (CPU0 hangs in arch_cpu_start/wfe()). Still an SMP kernel
# image, but only CPU0 is brought online — sufficient for thread entry breakpoints.
#
# Build:
#   west build -b zynqmp_apu/zynqmp_apu/smp samples/synchronization -d $BUILD_DIR \
#     -- -DEXTRA_CONF_FILE=$ZEPHYR_BASE/boards/amd/zynqmp_apu/support/thread_debug_smp_farm.conf

CONFIG_MP_MAX_NUM_CPUS=1

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_SCHED_CPU_MASK=y
CONFIG_ZYNQMP_SMP_FARM_GDB=y
