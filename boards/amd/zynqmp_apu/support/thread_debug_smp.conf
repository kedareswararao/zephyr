# Kconfig overlay for SMP per-thread GDB validation on zynqmp_apu/zynqmp_apu/smp.
# Use with samples/synchronization:
#   west build -b zynqmp_apu/zynqmp_apu/smp samples/synchronization -d $BUILD_DIR \
#     -- -DEXTRA_CONF_FILE=$ZEPHYR_BASE/boards/amd/zynqmp_apu/support/thread_debug_smp.conf

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_SCHED_CPU_MASK=y

# Default sample pins thread_a→CPU0, thread_b→CPU1. Breakpoints on thread_b
# will NOT hit on farm hw_server GDB (CPU0 only). For farm validation use
# thread_debug_smp_farm.conf instead (both threads pinned to CPU 0).
