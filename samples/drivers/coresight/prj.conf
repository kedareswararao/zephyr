# CoreSight Trace Sample Configuration
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y

# Enable CoreSight driver
CONFIG_DEBUG_DRIVER=y
CONFIG_CORESIGHT_XLNX=y
CONFIG_CORESIGHT_XLNX_AUTO_INIT=n
CONFIG_CORESIGHT_XLNX_BUFFER_SIZE=65536
CONFIG_CORESIGHT_XLNX_TRACE_ID=1
CONFIG_CORESIGHT_XLNX_TIMESTAMP=y
CONFIG_CORESIGHT_XLNX_RETURN_STACK=y
CONFIG_CORESIGHT_XLNX_LOG_LEVEL_INF=y

# Enable sufficient stack size
CONFIG_MAIN_STACK_SIZE=4096
